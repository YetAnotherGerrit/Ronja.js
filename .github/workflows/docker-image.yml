name: Docker image

# Publishes Ronja's image to the GitHub Container Registry (ghcr.io):
# - for every published release, tagged with its version, its major version and,
#   if it's the latest release, "latest";
# - weekly for the latest release, so the image picks up Node.js patch releases of
#   the pinned LTS line and Debian security updates. The npm dependencies stay the
#   same, as package-lock.json pins them.
on:
    release:
        types: [published]
    schedule:
        - cron: "0 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: docker-image
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Find the release to build
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
                  tag="${RELEASE_TAG:-$latest}"
                  version="${tag#v}"
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"

                  tags="$image:$version"
                  if [ "$PRERELEASE" != "true" ]; then
                      tags="$tags,$image:${version%%.*}"
                  fi
                  if [ "$tag" = "$latest" ]; then
                      tags="$tags,$image:latest"
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tags=$tags" >> "$GITHUB_OUTPUT"
                  echo "Building $tag as $tags"

            - uses: actions/checkout@v7
              with:
                  ref: ${{ steps.release.outputs.tag }}

            - uses: docker/setup-qemu-action@v4

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  # Always pull the base image, so every build gets the current Node.js patch release.
                  pull: true
                  push: true
                  tags: ${{ steps.release.outputs.tags }}
                  labels: org.opencontainers.image.version=${{ steps.release.outputs.version }}
